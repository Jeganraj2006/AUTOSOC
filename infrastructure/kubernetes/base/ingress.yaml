apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autosoc-ingress
  namespace: autosoc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: autosoc.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: autosoc-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: autosoc-web
            port:
              number: 3000
