apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosoc-web
  namespace: autosoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autosoc-web
  template:
    metadata:
      labels:
        app: autosoc-web
    spec:
      containers:
      - name: web
        image: autosoc/web:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: autosoc-config
---
apiVersion: v1
kind: Service
metadata:
  name: autosoc-web
  namespace: autosoc
spec:
  selector:
    app: autosoc-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
