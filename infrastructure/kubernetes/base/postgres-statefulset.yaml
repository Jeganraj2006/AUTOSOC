apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: autosoc
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: autosoc-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: autosoc-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: autosoc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: autosoc
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
