apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosoc-worker-ingestion
  namespace: autosoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-ingestion
      role: worker
  template:
    metadata:
      labels:
        app: worker-ingestion
        role: worker
    spec:
      containers:
      - name: worker
        image: autosoc/worker-ingestion:latest
        envFrom:
        - configMapRef:
            name: autosoc-config
        - secretRef:
            name: autosoc-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
