apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosoc-api
  namespace: autosoc
  labels:
    app: autosoc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autosoc-api
  template:
    metadata:
      labels:
        app: autosoc-api
    spec:
      containers:
      - name: api
        image: autosoc/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: autosoc-config
        - secretRef:
            name: autosoc-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autosoc-api
  namespace: autosoc
spec:
  selector:
    app: autosoc-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
