[project]
name = "autosoc-ml"
version = "0.1.0"
description = "AutoSOC Machine Learning Foundation"
authors = [{ name = "AutoSOC Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "mlflow>=2.10.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "pyyaml>=6.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["autosoc_ml"]
