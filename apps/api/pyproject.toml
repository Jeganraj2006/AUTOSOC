[project]
name = "autosoc-api"
version = "0.1.0-dev"
description = "AutoSOC Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.19.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.5",
    "autosoc-schemas",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.5",
    "mypy>=1.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-v --cov=autosoc_api --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
autosoc-schemas = { path = "../../packages/event-schemas", editable = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
]
