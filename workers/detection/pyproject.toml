[project]
name = "autosoc-detection"
version = "0.1.0-dev"
description = "AutoSOC Detection Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "aiokafka>=0.10.0",
    "redis>=5.0.6",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "autosoc-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.5",
    "mypy>=1.10.1",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-v --cov=autosoc_detection --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv.sources]
autosoc-schemas = { path = "../../packages/event-schemas" }
