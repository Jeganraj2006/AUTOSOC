[project]
name = "autosoc-correlation"
version = "0.1.0"
description = "AutoSOC Alert Correlation Worker"
authors = [
    { name = "AutoSOC Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastkafka",
    "pydantic",
    "pyyaml",
    "redis",
    "autosoc-schemas",
    "autosoc-api"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_correlation"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas" }
