[project]
name = "autosoc-agents"
version = "0.1.0"
description = "AutoSOC LangGraph Agent Worker for AI Investigation"
dependencies = [
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.1",
    "opensearch-py>=2.4.2",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "sentence-transformers>=3.0.0", # for local embeddings
    "autosoc-api",
    "autosoc-schemas"
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_agents"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas" }
