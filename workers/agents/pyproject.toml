[project]
name = "autosoc-agents"
version = "0.1.0"
description = "AutoSOC LangGraph Agent Worker for AI Investigation"
dependencies = [
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.1",
    "opensearch-py>=2.4.2",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "aiokafka>=0.11.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "autosoc-api",
    "autosoc-schemas"
]
# autosoc-api is a local dependency and requires Python 3.12 or newer.
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Keep test tooling out of the production worker dependency set.
dev = ["pytest>=8.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_agents"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas", editable = true }
