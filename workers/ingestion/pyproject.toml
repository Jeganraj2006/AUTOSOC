[project]
name = "autosoc-ingestion"
version = "0.1.0"
description = "AutoSOC Ingestion Worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "aiokafka",
    "redis",
    "minio",
    "autosoc-schemas",
    "autosoc-api",
    "prometheus-client"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_ingestion"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas" }

