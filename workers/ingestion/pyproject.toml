[project]
name = "autosoc-ingestion"
version = "0.1.0"
description = "AutoSOC Ingestion Worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "aiokafka",
    "redis",
    "minio",
    "autosoc-schemas",
    "autosoc-api",
    "prometheus-client"
]

[project.optional-dependencies]
# Development-only test tooling.  These extras are intentionally not part of
# the worker's production dependency set or container image.
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_ingestion"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas", editable = true }
