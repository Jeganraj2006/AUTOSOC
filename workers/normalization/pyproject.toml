[project]
name = "autosoc-normalization"
version = "0.1.0"
description = "AutoSOC Normalization Worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "aiokafka",
    "python-snappy",
    "opensearch-py[async]",
    "httpx",
    "redis>=5.0.6",
    "autosoc-schemas",
    "autosoc-api"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc_normalization"]

[tool.uv.sources]
autosoc-api = { path = "../../apps/api" }
autosoc-schemas = { path = "../../packages/event-schemas", editable = true }
